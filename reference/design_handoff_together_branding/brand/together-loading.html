<!-- Together — Ladebildschirm (Handoff-Referenz) -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Together — Ladebildschirm</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #f3ede1 0%, #ece4d5 100%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 40px; box-sizing: border-box;
    font-family: var(--font-body);
  }

  /* ── Phone ─────────────────────────────────────────── */
  .device {
    width: 320px; height: 660px;
    background: #1c1a17; border-radius: 54px; padding: 13px;
    box-shadow: 0 30px 70px rgba(60,45,30,0.32), 0 4px 12px rgba(60,45,30,0.2);
  }
  .screen {
    position: relative; width: 100%; height: 100%;
    background:
      radial-gradient(130% 80% at 50% 12%, #ffffff 0%, var(--bg) 60%);
    border-radius: 42px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .island {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 104px; height: 30px; background: #1c1a17; border-radius: 16px; z-index: 5;
  }
  .statusbar {
    position: absolute; top: 15px; left: 0; right: 0; z-index: 4;
    display: flex; justify-content: space-between; padding: 0 30px;
    font-family: var(--font-headline); font-weight: 600; font-size: 13px; color: var(--text);
  }
  .statusbar .icons { display: flex; align-items: center; gap: 5px; }
  .statusbar .bars { display: flex; align-items: flex-end; gap: 2px; height: 11px; }
  .statusbar .bars i { width: 3px; background: var(--text); border-radius: 1px; }
  .statusbar .bars i:nth-child(1){height:4px} .statusbar .bars i:nth-child(2){height:6px}
  .statusbar .bars i:nth-child(3){height:8px} .statusbar .bars i:nth-child(4){height:11px}
  .statusbar .batt { width: 22px; height: 11px; border: 1.5px solid var(--text); border-radius: 3px; position: relative; }
  .statusbar .batt::after { content:""; position:absolute; right:-3px; top:3px; width:2px; height:5px; background:var(--text); border-radius:0 1px 1px 0; }
  .statusbar .batt::before { content:""; position:absolute; inset:1.5px; width:70%; background:var(--text); border-radius:1px; }

  /* ── Logo build-up ─────────────────────────────────── */
  .stack { display: flex; flex-direction: column; align-items: center; gap: 26px; margin-bottom: 40px; }

  .mark { position: relative; width: 150px; height: 96px; animation: breathe 2.8s var(--ease-standard) infinite; }
  .circle {
    position: absolute; top: 50%; width: 96px; height: 96px; margin-top: -48px;
    border-radius: 50%; mix-blend-mode: multiply;
  }
  .circle.left  { left: 0;  background: var(--haushalt); animation: slideL 5s var(--ease-standard) infinite; }
  .circle.right { right: 0; background: var(--finanzen); animation: slideR 5s var(--ease-standard) infinite; }

  .word {
    font-family: var(--font-headline); font-weight: 600; font-size: 40px;
    letter-spacing: -0.5px; color: var(--text);
    animation: wordIn 5s var(--ease-standard) infinite;
  }
  .tag {
    font-size: 13.5px; color: var(--text-secondary); font-weight: 600; margin-top: -14px;
    animation: tagIn 5s var(--ease-standard) infinite;
  }

  /* loader dots */
  .dots { position: absolute; bottom: 54px; display: flex; gap: 8px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); animation: blink 1.4s ease-in-out infinite; }
  .dots i:nth-child(2){ animation-delay: .2s } .dots i:nth-child(3){ animation-delay: .4s }

  @keyframes slideL {
    0%   { transform: translateX(-170px) scale(.5); opacity: 0; }
    8%   { transform: translateX(16px)  scale(1.05); opacity: 1; }
    14%  { transform: translateX(0)     scale(1); }
    80%  { transform: translateX(0)     scale(1); opacity: 1; }
    92%  { transform: translateX(-10px) scale(.85); opacity: 0; }
    100% { transform: translateX(-170px) scale(.5); opacity: 0; }
  }
  @keyframes slideR {
    0%   { transform: translateX(170px) scale(.5); opacity: 0; }
    8%   { transform: translateX(-16px) scale(1.05); opacity: 1; }
    14%  { transform: translateX(0)     scale(1); }
    80%  { transform: translateX(0)     scale(1); opacity: 1; }
    92%  { transform: translateX(10px)  scale(.85); opacity: 0; }
    100% { transform: translateX(170px) scale(.5); opacity: 0; }
  }
  @keyframes wordIn {
    0%, 15% { opacity: 0; transform: translateY(16px) scale(.95); }
    28%     { opacity: 1; transform: translateY(0) scale(1); }
    80%     { opacity: 1; transform: translateY(0) scale(1); }
    92%     { opacity: 0; transform: translateY(-8px); }
    100%    { opacity: 0; }
  }
  @keyframes tagIn {
    0%, 24% { opacity: 0; transform: translateY(10px); }
    38%     { opacity: 1; transform: translateY(0); }
    80%     { opacity: 1; }
    90%     { opacity: 0; }
    100%    { opacity: 0; }
  }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  @keyframes blink   { 0%,100% { opacity: .3; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }

  @media (prefers-reduced-motion: reduce) {
    .circle, .word, .tag, .mark { animation: none !important; }
    .circle { opacity: 1; transform: none; }
    .word, .tag { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <div class="device">
    <div class="screen">
      <div class="island"></div>
      <div class="statusbar">
        <span>9:41</span>
        <span class="icons">
          <span class="bars"><i></i><i></i><i></i><i></i></span>
          <span class="batt"></span>
        </span>
      </div>

      <div class="stack">
        <div class="mark">
          <div class="circle left"></div>
          <div class="circle right"></div>
        </div>
        <div class="word">Together</div>
        <div class="tag">Euer Zuhause, gemeinsam.</div>
      </div>

      <div class="dots"><i></i><i></i><i></i></div>
    </div>
  </div>
</body>
</html>

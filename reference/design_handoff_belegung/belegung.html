<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belegung — Prototyp</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body {
    min-height: 100dvh;
    background: radial-gradient(120% 80% at 50% 0%, #f3ede1 0%, #e9e1d2 100%);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 34px 20px 60px; box-sizing: border-box;
    font-family: var(--font-body); font-weight: 600;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-hover); }
  * { -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes bfade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bslide { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .bsheet { animation: bslide .28s cubic-bezier(0.34, 1.3, 0.64, 1); }
  @media (prefers-reduced-motion: reduce) { .bsheet { animation: none; } }
  input[type="time"].app-field { font-family: var(--font-headline); font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="./belegung-data.js"></script>
<script type="text/babel" src="./tweaks-panel.jsx"></script>
<script type="text/babel" src="./belegung-views.jsx"></script>
<script type="text/babel" src="./belegung-sheet.jsx"></script>
<script type="text/babel" src="./belegung-settings.jsx"></script>
<script type="text/babel" src="./belegung-app.jsx"></script>
<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.BelegungApp));
</script>
</body>
</html>

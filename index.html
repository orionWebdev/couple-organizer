<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdfaf5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TwoDo" />
    <title>TwoDo</title>

    <link rel="preload" href="/fonts/fredoka-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/nunito-var.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Splash: sichtbar ab dem ersten Paint, bis main.ts nach authReady gemountet hat.
         Werte hier literal statt via Tokens — app.css kommt erst mit dem JS-Bundle. -->
    <style>
      /* Selbst gehostet statt vom Google-CDN: in der APK gäbe es die Schrift
         sonst erst nach der ersten Netzantwort und offline nie — der Splash
         selbst wäre das erste Opfer. Muss hier im Head stehen und nicht in
         app.css, weil app.css erst mit dem JS-Bundle kommt.
         Beide sind Variable Fonts: eine Datei deckt alle Gewichte ab. */
      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url('/fonts/fredoka-var.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-weight: 200 1000;
        font-display: swap;
        src: url('/fonts/nunito-var.woff2') format('woff2');
      }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(130% 80% at 50% 12%, #ffffff 0%, #fdfaf5 60%);
        transition: opacity 400ms cubic-bezier(0.4, 0, 1, 1), transform 400ms cubic-bezier(0.4, 0, 1, 1);
      }
      #splash.is-hiding {
        opacity: 0;
        transform: scale(1.02);
      }

      .splash-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
        margin-bottom: 40px;
      }

      /* Kreis-Ø 96px, Mittenabstand 0.424 × Ø — abgeleitet aus der Logo-Geometrie (r=33, cx 46/74) */
      .splash-mark {
        position: relative;
        width: 137px;
        height: 96px;
        animation: splashBreathe 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .splash-circle {
        position: absolute;
        top: 0;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        mix-blend-mode: multiply;
        opacity: 0;
      }
      .splash-circle.left {
        left: 0;
        background: oklch(0.7 0.15 38);
        animation: splashSlideL 700ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .splash-circle.right {
        right: 0;
        background: oklch(0.69 0.1 195);
        animation: splashSlideR 700ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      .splash-word {
        font-family: 'Fredoka', system-ui, sans-serif;
        font-weight: 600;
        font-size: 40px;
        letter-spacing: -0.5px;
        color: #2c2823;
        opacity: 0;
        animation: splashWordIn 1400ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      /* Wortmarke „TwoDo": erste Silbe Terrakotta, zweite Türkis — dieselben
         Farben wie die beiden Splash-Kreise (Tokens gibt es hier noch nicht). */
      .splash-word .w-two { color: oklch(0.7 0.15 38); }
      .splash-word .w-do { color: oklch(0.69 0.1 195); }
      .splash-tag {
        font-family: 'Nunito', system-ui, sans-serif;
        font-weight: 600;
        font-size: 13.5px;
        color: #8c857b;
        margin-top: -14px;
        opacity: 0;
        animation: splashTagIn 1900ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      .splash-dots {
        position: absolute;
        bottom: calc(54px + env(safe-area-inset-bottom, 0px));
        display: flex;
        gap: 8px;
      }
      .splash-dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #b8b0a4;
        animation: splashBlink 1.4s ease-in-out infinite;
      }
      .splash-dots i:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots i:nth-child(3) { animation-delay: 0.4s; }

      /* Keyframe-Prozente des 5-s-Referenz-Loops, umgerechnet auf einen einmaligen Aufbau */
      @keyframes splashSlideL {
        0%   { transform: translateX(-170px) scale(0.5); opacity: 0; }
        57%  { transform: translateX(16px) scale(1.05); opacity: 1; }
        100% { transform: translateX(0) scale(1); opacity: 1; }
      }
      @keyframes splashSlideR {
        0%   { transform: translateX(170px) scale(0.5); opacity: 0; }
        57%  { transform: translateX(-16px) scale(1.05); opacity: 1; }
        100% { transform: translateX(0) scale(1); opacity: 1; }
      }
      @keyframes splashWordIn {
        0%, 54% { opacity: 0; transform: translateY(16px) scale(0.95); }
        100%    { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes splashTagIn {
        0%, 63% { opacity: 0; transform: translateY(10px); }
        100%    { opacity: 1; transform: translateY(0); }
      }
      @keyframes splashBreathe {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.03); }
      }
      @keyframes splashBlink {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50%      { opacity: 1; transform: scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-mark,
        .splash-circle,
        .splash-word,
        .splash-tag,
        .splash-dots i {
          animation: none !important;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="splash">
      <div class="splash-stack">
        <div class="splash-mark">
          <div class="splash-circle left"></div>
          <div class="splash-circle right"></div>
        </div>
        <div class="splash-word"><span class="w-two">Two</span><span class="w-do">Do</span></div>
        <div class="splash-tag">Euer Zuhause, gemeinsam.</div>
      </div>
      <div class="splash-dots"><i></i><i></i><i></i></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
